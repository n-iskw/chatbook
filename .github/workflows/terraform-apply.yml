name: Terraform Apply (via approval comment)

on:
  issue_comment:
    types: [created]

concurrency:
  group: terraform-prod
  cancel-in-progress: false

jobs:
  apply:
    if: |
      github.event.issue.pull_request != null &&
      contains(github.event.comment.body, 'approve') &&
      github.event.repository.name != 'fullstack-worker-template'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      issues: write
      pull-requests: read
    defaults:
      run:
        working-directory: terraform/envs/prod
    steps:
      - name: Validate approval comment
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          body="$(echo "$COMMENT_BODY" | xargs)"
          if [ "$body" != "approve" ]; then
            echo "コメント本文が 'approve' と完全一致しません (実際: '$body')。何もしません。" >&2
            exit 1
          fi

          allowed="${{ vars.TERRAFORM_APPROVERS }}"
          if [ -z "$allowed" ]; then
            echo "リポジトリ変数 TERRAFORM_APPROVERS が未設定です" >&2
            exit 1
          fi
          IFS=',' read -ra approvers <<< "$allowed"
          ok=false
          for a in "${approvers[@]}"; do
            if [ "$(echo "$a" | xargs)" = "$COMMENTER" ]; then
              ok=true
              break
            fi
          done
          if [ "$ok" != "true" ]; then
            echo "$COMMENTER は承認権限がありません" >&2
            exit 1
          fi
          echo "承認者確認 OK: $COMMENTER"

      - name: Verify the PR is merged into main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          pr_json=$(gh pr view "$ISSUE_NUMBER" --repo "$REPO" --json state,mergedAt,baseRefName)
          merged_at=$(echo "$pr_json" | jq -r '.mergedAt')
          base_ref=$(echo "$pr_json" | jq -r '.baseRefName')
          if [ "$merged_at" = "null" ]; then
            echo "この PR はまだ main にマージされていません" >&2
            exit 1
          fi
          if [ "$base_ref" != "main" ]; then
            echo "この PR の base ブランチが main ではありません ($base_ref)" >&2
            exit 1
          fi
          echo "マージ済み確認 OK"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"

      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.R2_BUCKET }}" \
            -backend-config="key=cognito/terraform.tfstate" \
            -backend-config="region=auto" \
            -backend-config="access_key=${{ secrets.R2_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_s3_checksum=true" \
            -backend-config="use_path_style=true" \
            -backend-config="endpoints={s3=\"https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com\"}"

      - name: terraform apply
        id: apply
        run: terraform apply -input=false -auto-approve

      - name: Reply with result
        if: always()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const success = "${{ steps.apply.outcome }}" === "success";
            const body = [
              success ? "✅ terraform apply が成功しました。" : "❌ terraform apply が失敗しました。",
              "",
              `*Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}*`,
            ].join("\n");
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
