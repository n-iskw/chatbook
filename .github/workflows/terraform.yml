name: Terraform (prod)

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
  pull_request:
    paths:
      - "terraform/**"

concurrency:
  group: terraform-prod
  cancel-in-progress: false

jobs:
  plan:
    if: github.event.repository.name != 'fullstack-worker-template'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      issues: write
    defaults:
      run:
        working-directory: terraform/envs/prod
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15.8"

      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: terraform fmt -check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: terraform init
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.R2_BUCKET }}" \
            -backend-config="key=cognito/terraform.tfstate" \
            -backend-config="region=auto" \
            -backend-config="access_key=${{ secrets.R2_ACCESS_KEY_ID }}" \
            -backend-config="secret_key=${{ secrets.R2_SECRET_ACCESS_KEY }}" \
            -backend-config="skip_credentials_validation=true" \
            -backend-config="skip_region_validation=true" \
            -backend-config="skip_requesting_account_id=true" \
            -backend-config="skip_s3_checksum=true" \
            -backend-config="use_path_style=true" \
            -backend-config="endpoints={s3=\"https://${{ vars.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com\"}"

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Show plan in job summary
        run: terraform show -no-color tfplan | tee plan.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Comment plan on PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require("fs");
            const marker = "<!-- terraform-plan -->";
            let plan = fs.readFileSync("terraform/envs/prod/plan.txt", "utf8");

            const limit = 60000;
            if (plan.length > limit) {
              plan = plan.slice(0, limit) + "\n\n... (truncated: 全文はジョブサマリを参照)";
            }

            let issueNumber;
            if (context.eventName === "pull_request") {
              issueNumber = context.issue.number;
            } else {
              const { data: prs } = await github.request(
                "GET /repos/{owner}/{repo}/commits/{commit_sha}/pulls",
                { owner: context.repo.owner, repo: context.repo.repo, commit_sha: context.sha },
              );
              if (prs.length === 0) {
                console.log("この commit に紐づく PR が見つからないためコメントをスキップします");
                return;
              }
              issueNumber = prs[0].number;
            }

            const approvalNote =
              context.eventName === "push"
                ? "\n\n承認するには、この PR に **`approve`** とコメントしてください(要 `TERRAFORM_APPROVERS` 権限)。"
                : "";

            const body = [
              marker,
              "## Terraform plan (prod)",
              "<details><summary>Show plan</summary>",
              "",
              "```",
              plan,
              "```",
              "",
              "</details>",
              approvalNote,
              "",
              `*Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}*`,
            ].join("\n");

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              per_page: 100,
            });
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body,
              });
            }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tfplan
          path: terraform/envs/prod/tfplan
